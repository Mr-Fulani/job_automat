<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HH Automation — Admin Login</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: #0b1220; color: #e5e7eb; margin: 0; }
      .wrap { max-width: 520px; margin: 12vh auto; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      p { margin: 0 0 16px; color: #9ca3af; }
      label { display:block; font-size: 12px; margin-bottom: 6px; color: #cbd5e1; }
      input { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #e5e7eb; padding: 10px 12px; }
      button { margin-top: 12px; width: 100%; border-radius: 10px; border: 1px solid #334155; background: #2563eb; color: #fff; padding: 10px 12px; cursor: pointer; }
      .err { margin-top: 12px; color: #fca5a5; font-size: 12px; }
      .hint { margin-top: 12px; font-size: 12px; color: #9ca3af; }
      code { background: #0b1220; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin Login</h1>
      <p>Введите <code>ADMIN_TOKEN</code> (он должен быть задан в <code>.env</code>).</p>

      <form method="post" action="/ui/login">
        <input type="hidden" name="next" value="{{ next }}" />
        <label for="token">ADMIN_TOKEN</label>
        <input id="token" name="token" type="password" autocomplete="current-password" />
        <button type="submit">Войти</button>
      </form>

      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}

      <div class="hint">
        После входа будет установлена cookie <code>admin_token</code>. Для API можно также передавать заголовок <code>X-Admin-Token</code>.
      </div>
    </div>
  </body>
</html>
